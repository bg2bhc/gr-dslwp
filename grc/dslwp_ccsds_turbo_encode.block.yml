id: dslwp_ccsds_turbo_encode
label: CCSDS Turbo Encode
category: '[DSLWP]'

templates:
  imports: from gnuradio import dslwp
  make: dslwp.ccsds_turbo_encode(${base}, ${octets}, ${code_type}, ${pass_other_length})

parameters:
-   id: base
    label: Base
    dtype: int
    default: '223'
-   id: octets
    label: Octets
    dtype: int
    default: '1'
-   id: code_type
    label: Code Type
    dtype: enum
    default: '2'
    options: ['2', '3', '4', '6']
    option_labels: [Rate 1/2, Rate 1/3, Rate 1/4, Rate 1/6]
-   id: pass_other_length
    label: Pass Other Length
    dtype: enum
    default: 'True'
    options: ['False', 'True']
    option_labels: [False, True]

inputs:
-   domain: message
    id: in

outputs:
-   domain: message
    id: out


#  'file_format' specifies the version of the GRC yml format used in the file
#  and should usually not be changed.
file_format: 1
