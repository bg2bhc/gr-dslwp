id: dslwp_ccsds_pseudo_randomizer
label: CCSDS Pseudo Randomizer
category: '[DSLWP]'

templates:
  imports: from gnuradio import dslwp
  make: dslwp.ccsds_pseudo_randomizer(${data_format})

parameters:
-   id: data_format
    label: Data Format
    dtype: enum
    default: '1'
    options: ['1', '2', '3']
    option_labels: [Bits, Packed bits, Float Bits]

inputs:
-   domain: message
    id: in

outputs:
-   domain: message
    id: out



#  'file_format' specifies the version of the GRC yml format used in the file
#  and should usually not be changed.
file_format: 1
