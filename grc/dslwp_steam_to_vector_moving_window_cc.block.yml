id: dslwp_steam_to_vector_moving_window_cc
label: Steam to Vector Moving Window CC
category: '[DSLWP]'

templates:
  imports: from gnuradio import dslwp
  make: dslwp.steam_to_vector_moving_window_cc(${vlen})


parameters:
-   id: vlen
    label: Vec Length
    dtype: int
    hide: ${ 'part' if vlen == 1 else 'none' }

inputs:
-   domain: stream
    dtype: complex

outputs:
-   domain: stream
    dtype: complex
    vlen: ${ vlen }


#  'file_format' specifies the version of the GRC yml format used in the file
#  and should usually not be changed.
file_format: 1
