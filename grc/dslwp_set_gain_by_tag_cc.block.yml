id: dslwp_set_gain_by_tag_cc
label: Set Gain by Tag CC
category: '[DSLWP]'

templates:
  imports: from gnuradio import dslwp
  make: dslwp.set_gain_by_tag_cc(${k}, ${gain})


parameters:
-   id: k
    label: K
    dtype: float
    default: '512'
-   id: gain
    label: Gain
    dtype: float
    default: '1'

inputs:
-   domain: stream
    dtype: complex

outputs:
-   domain: stream
    dtype: complex


#  'file_format' specifies the version of the GRC yml format used in the file
#  and should usually not be changed.
file_format: 1
