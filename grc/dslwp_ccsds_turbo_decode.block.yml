id: dslwp_ccsds_turbo_decode
label: CCSDS Turbo Decode
category: '[DSLWP]'

templates:
  imports: from gnuradio import dslwp
  make: dslwp.ccsds_turbo_decode(${base}, ${octets}, ${code_type}, ${iterations}, ${sigma}, ${update_sigma})


parameters:
-   id: base
    label: Base
    dtype: int
    default: '223'
-   id: octets
    label: Octets
    dtype: int
    default: '1'
-   id: code_type
    label: Code Type
    dtype: enum
    default: '2'
    options: ['2', '3', '4', '6']
    option_labels: [Rate 1/2, Rate 1/3, Rate 1/4, Rate 1/6]
-   id: iterations
    label: Iterations
    dtype: int
    default: '2'
-   id: sigma
    label: Sigma
    dtype: float
    default: '0.707'
-   id: update_sigma
    label: Update Sigma
    dtype: enum
    default: 'true'
    options: ['1', '0']
    option_labels: ['ON', 'OFF']

inputs:
-   domain: message
    id: in

outputs:
-   domain: message
    id: out



#  'file_format' specifies the version of the GRC yml format used in the file
#  and should usually not be changed.
file_format: 1
