id: dslwp_differential_phase_detection_1bit_cf
label: Differential Phase Detection 1bit CF
category: '[DSLWP]'

templates:
  imports: from gnuradio import dslwp
  make: dslwp.differential_phase_detection_1bit_cf(${samples_per_symbol}, ${&taps}, ${opt_point}, ${delay})


parameters:
-   id: samples_per_symbol
    label: Samples per Symbol
    dtype: int
-   id: taps
    label: Taps
    dtype: complex_vector
-   id: opt_point
    label: Opt. Point
    dtype: int
-   id: delay
    label: Delay
    dtype: int

inputs:
-   domain: stream
    dtype: complex

outputs:
-   domain: stream
    dtype: float


#  'file_format' specifies the version of the GRC yml format used in the file
#  and should usually not be changed.
file_format: 1
