id: dslwp_kiss_encode_pdu
label: KISS Encode PDU
category: '[DSLWP]'

templates:
  imports: from gnuradio import dslwp
  make: dslwp.kiss_encode_pdu(${const_length})

parameters:
-   id: const_length
    label: Const Length
    dtype: int
    default: '-1'

inputs:
-   domain: message
    id: in

outputs:
-   domain: message
    id: out


#  'file_format' specifies the version of the GRC yml format used in the file
#  and should usually not be changed.
file_format: 1
