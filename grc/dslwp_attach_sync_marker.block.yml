id: dslwp_attach_sync_marker
label: Attach Sync Marker
category: '[DSLWP]'
templates:
  imports: from gnuradio import dslwp
  make: dslwp.attach_sync_marker(${marker}, ${data_format}, ${msg_len}, ${check_length}, ${pass_other_length})

parameters:
-   id: marker
    label: Marker
    dtype: raw
-   id: data_format
    label: Data Format
    dtype: enum
    default: '1'
    options: ['1', '2']
    option_labels: [Bits, Packed bits]
-   id: msg_len
    label: Message Length
    dtype: int
-   id: check_length
    label: Check Length
    dtype: enum
    default: 'False'
    options: ['False', 'True']
    option_labels: [False, True]
-   id: pass_other_length
    label: Pass Other Length
    dtype: enum
    default: 'True'
    options: ['False', 'True']
    option_labels: [False, True]

inputs:
-   domain: message
    id: in

outputs:
-   domain: message
    id: out


#  'file_format' specifies the version of the GRC yml format used in the file
#  and should usually not be changed.
file_format: 1
