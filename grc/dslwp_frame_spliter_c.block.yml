id: dslwp_frame_spliter_c
label: Frame Spliter C
category: '[DSLWP]'

templates:
  imports: from gnuradio import dslwp
  make: dslwp.frame_spliter_c(${&key}, ${frame_length})

parameters:
-   id: key
    label: Key
    dtype: string
    default: payload_start
-   id: frame_length
    label: Frame Length
    dtype: int
    default: '3576'

inputs:
-   domain: stream
    dtype: complex

outputs:
-   domain: message
    id: out


#  'file_format' specifies the version of the GRC yml format used in the file
#  and should usually not be changed.
file_format: 1
