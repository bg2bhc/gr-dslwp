id: dslwp_lrtc_demod
label: LRTC Demod
category: '[DSLWP]'

templates:
  imports: from gnuradio import dslwp
  make: dslwp.lrtc_demod(${mode}, ${fft_size}, ${n_avg})

parameters:
-   id: mode
    label: Mode
    dtype: int
-   id: fft_size
    label: FFT Size
    dtype: int
-   id: n_avg
    label: N Average
    dtype: int

inputs:
-   label: pwr
    domain: stream
    dtype: float
-   label: freq
    domain: stream
    dtype: float
-   label: snr
    domain: stream
    dtype: float

outputs:
-   domain: stream
    dtype: complex

#  'file_format' specifies the version of the GRC yml format used in the file
#  and should usually not be changed.
file_format: 1
